name: Release wheels
# Bare semver tags with an optional pre-release suffix (0.1.0, 0.2.0-rc1), as in cs_dmri. GitHub's
# tag filters are globs: `+` is one or more of the preceding character, `*` any trailing characters.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  verify-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          PKG_VERSION=$(awk '/^\[package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version[[:space:]]*=/ { gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, ""); print; exit }' Cargo.toml)
          echo "Cargo.toml: $PKG_VERSION"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "not a tag push; skipping the check"; exit 0; fi
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag:        $TAG_VERSION"
          # a Cargo pre-release is 0.2.0-rc1; maturin publishes it to PyPI as 0.2.0rc1
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::tag $TAG_VERSION does not match Cargo.toml version $PKG_VERSION; bump or retag"; exit 1; }

  wheels:
    name: wheel ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --features wgpu
          # the itk feature's static HDF5 needs cmake inside the manylinux container
          before-script-linux: dnf install -y cmake || yum install -y cmake
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    name: publish to PyPI
    needs: wheels
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; register the workflow on PyPI first
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
