name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TRXSCAN_VERSION: "0.2.1"

jobs:
  build-test:
    name: build, unit tests, operator check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-shared-key: ci
      - run: cargo fmt --check
      - run: cargo clippy --release --features wgpu -- -D warnings
      - run: cargo build --release --features wgpu
      - run: cargo test --release --features wgpu
      - name: operator check against the stored PyTorch dumps
        run: ./target/release/unpile --device flex check --dir testdata/rpe
      - uses: actions/upload-artifact@v4
        with:
          name: unpile-linux-x86_64
          path: target/release/unpile

  fixtures:
    name: truth-scored TRXScan fixtures
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci
      - name: build (shares the build job's cache)
        run: cargo build --release --features wgpu --tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "trxscan[trx]==${TRXSCAN_VERSION}" nibabel nilearn scikit-image scipy numpy
      - name: phantom cache (TRXScan fetches sub-60501 from its GitHub release)
        uses: actions/cache@v4
        with:
          path: ~/.cache/trxscan
          key: trxscan-phantom-${{ env.TRXSCAN_VERSION }}
      - name: fixture cache
        id: fixtures
        uses: actions/cache@v4
        with:
          path: testdata/fixtures
          key: fixtures-${{ env.TRXSCAN_VERSION }}-${{ hashFiles('tests/fixtures/trxscan_fixtures.txt', 'scripts/prep_fixture.py', 'scripts/make_fixtures.py') }}
      - name: generate fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: python scripts/make_fixtures.py phasediff rpe
      - name: truth-scored fits (CPU, levels 24/12/6, 20 iterations)
        run: cargo test --release --features wgpu --test fixtures -- --nocapture --test-threads=1
        env:
          UNPILE_FIXTURES: ${{ github.workspace }}/testdata/fixtures

  docs:
    name: docs (Sphinx, CLI pages in sync)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unpile-linux-x86_64
          path: bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: CLI pages match the binary's --help
        run: |
          chmod +x bin/unpile
          python docs/tools/make_cli_pages.py bin/unpile
          git diff --exit-code -- docs/cli
      - run: sphinx-build -W docs docs/_build/html

  wheel:
    name: wheel (maturin build, install, Python tests)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest
      - run: maturin build --release --features wgpu --out dist
      - run: pip install "$(ls dist/*.whl)[prep]"
      - name: console script, module shim, Python API
        run: |
          unpile --help > /dev/null
          python -m unpile --help > /dev/null
          python -m pytest -q python/tests
