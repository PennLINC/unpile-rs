[package]
name = "unpile"
version = "0.2.0"
edition = "2021"
description = "Susceptibility distortion correction for EPI with a mass-conserving pushforward model (Rust port of the unpile prototype)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PennLINC/unpile-rs"
readme = "README.md"

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "flex", "ndarray", "autodiff"] }
# burn's `flex` feature pulls burn-flex with only `std`; its rayon parallelism and SIMD kernels are opt-in
burn-flex = { version = "0.22", features = ["std", "simd", "rayon"] }
nifti = { version = "0.18", features = ["ndarray_volumes", "nalgebra_affine"] }
# ITK transform conventions (RAS/LPS boundary, Insight Transform File, Composite.h5); pulls a static HDF5 build
itk-transforms-rs = { git = "https://github.com/PennLINC/itk-transforms-rs", optional = true }
ndarray = "0.17"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1"

[features]
default = ["itk"]
itk = ["dep:itk-transforms-rs"]
wgpu = ["burn/wgpu"]
# Burn's JIT CPU backend (CubeCL kernels through a bundled LLVM, with fusion); not available on wasm
cpu = ["burn/cpu", "burn/fusion"]

[profile.release]
opt-level = 3
